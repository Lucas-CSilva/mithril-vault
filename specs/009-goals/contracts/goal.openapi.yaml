openapi: "3.0.3"
info:
  title: Mithril Vault — Goals API
  version: "1.0.0"
  description: Savings goals (Cofres) with progress tracking and completion projections.

servers:
  - url: /mithril-vault

security:
  - BearerAuth: []

tags:
  - name: goals

paths:

  /goals:
    get:
      summary: List goals
      operationId: listGoals
      tags: [goals]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [IN_PROGRESS, COMPLETED, ABANDONED]
            description: Filter by status. If omitted, returns IN_PROGRESS and COMPLETED.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      summary: Create a goal
      operationId: createGoal
      tags: [goals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalCommand"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /goals/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }

    get:
      summary: Get a goal
      operationId: getGoal
      tags: [goals]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      summary: Update goal metadata
      operationId: updateGoal
      tags: [goals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoalCommand"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Abandon a goal (sets status to ABANDONED)
      operationId: abandonGoal
      tags: [goals]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /goals/{id}/progress:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }

    post:
      summary: Record a progress update (new currentAmount)
      description: |
        Appends a ProgressEntry to the history. If the new amount >= targetAmount,
        status automatically transitions to COMPLETED.
      operationId: updateGoalProgress
      tags: [goals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoalProgressCommand"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Goal not found or not owned by the caller
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    CreateGoalCommand:
      type: object
      required: [name, targetAmount]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        targetAmount:
          type: integer
          format: int64
          minimum: 1
          description: Centavos
        currentAmount:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: Centavos. Starting amount already saved.
        deadline:
          type: string
          format: date
          nullable: true
        linkedAccountId:
          type: string
          format: uuid
          nullable: true
        icon:
          type: string
          maxLength: 50
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"

    UpdateGoalCommand:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        targetAmount:
          type: integer
          format: int64
          minimum: 1
        deadline:
          type: string
          format: date
          nullable: true
        linkedAccountId:
          type: string
          format: uuid
          nullable: true
        icon:
          type: string
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        status:
          type: string
          enum: [IN_PROGRESS, ABANDONED]
          description: Use to reactivate an abandoned goal (IN_PROGRESS) or to abandon manually.

    UpdateGoalProgressCommand:
      type: object
      required: [currentAmount]
      properties:
        currentAmount:
          type: integer
          format: int64
          minimum: 0
          description: New total saved amount in centavos

    GoalResponse:
      type: object
      required: [id, name, targetAmount, currentAmount, status]
      description: Does not include ownerId.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        targetAmount:
          type: integer
          format: int64
          description: Centavos
        currentAmount:
          type: integer
          format: int64
          description: Centavos
        percentage:
          type: number
          format: double
          description: currentAmount / targetAmount × 100
        remainingAmount:
          type: integer
          format: int64
          description: Centavos. targetAmount - currentAmount.
        deadline:
          type: string
          format: date
          nullable: true
        linkedAccountId:
          type: string
          format: uuid
          nullable: true
        icon:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        status:
          type: string
          enum: [IN_PROGRESS, COMPLETED, ABANDONED]
        projection:
          $ref: "#/components/schemas/GoalProjection"
        createdAt:
          type: string
          format: date-time

    GoalProjection:
      type: object
      description: Derived projection. Null if insufficient data.
      properties:
        requiredMonthly:
          type: integer
          format: int64
          nullable: true
          description: Centavos. Only when deadline is set.
        projectedCompletionMonths:
          type: integer
          nullable: true
          description: Estimated months to completion based on avg monthly contribution. Only when no deadline.
        avgMonthlyContribution:
          type: integer
          format: int64
          nullable: true
          description: Centavos. Average of last 3 progress entries.

    ErrorResponse:
      type: object
      required: [timestamp, status, error, message]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
