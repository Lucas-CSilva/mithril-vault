openapi: "3.0.3"
info:
  title: Mithril Vault — Budgets API
  version: "1.0.0"
  description: |
    Monthly spending caps per category with real-time spentAmount aggregation.

servers:
  - url: /mithril-vault

security:
  - BearerAuth: []

tags:
  - name: budgets

paths:

  /budgets:
    get:
      summary: List budgets for a given month
      operationId: listBudgets
      tags: [budgets]
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
            example: "2026-06"
      responses:
        "200":
          description: Budgets with derived spentAmount
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      summary: Create a budget
      operationId: createBudget
      tags: [budgets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBudgetCommand"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Budget already exists for this category and month
        "422":
          $ref: "#/components/responses/ValidationError"

  /budgets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }

    patch:
      summary: Update a budget
      operationId: updateBudget
      tags: [budgets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBudgetCommand"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Delete a budget
      operationId: deleteBudget
      tags: [budgets]
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /budgets/actuals:
    get:
      summary: Budget vs actuals table for a given month
      description: |
        Returns all categories (budgeted and un-budgeted) with actual spending and
        budget limit (if any). Useful for discovering categories with no budget set.
      operationId: getBudgetActuals
      tags: [budgets]
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetActualRow"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Budget not found or not owned by the caller
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    CreateBudgetCommand:
      type: object
      required: [categoryId, month, limitAmount]
      properties:
        categoryId:
          type: string
          format: uuid
        month:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
          example: "2026-06"
        limitAmount:
          type: integer
          format: int64
          minimum: 1
          description: Centavos
        isRecurring:
          type: boolean
          default: false
        alertAt80:
          type: boolean
          default: true
        alertAt100:
          type: boolean
          default: true

    UpdateBudgetCommand:
      type: object
      properties:
        limitAmount:
          type: integer
          format: int64
          minimum: 1
        isRecurring:
          type: boolean
        alertAt80:
          type: boolean
        alertAt100:
          type: boolean

    BudgetResponse:
      type: object
      required: [id, categoryId, month, limitAmount, spentAmount, percentage, status]
      description: Does not include ownerId.
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
          description: Denormalized from category for display convenience
        month:
          type: string
          example: "2026-06"
        limitAmount:
          type: integer
          format: int64
          description: Centavos
        spentAmount:
          type: integer
          format: int64
          description: Derived. Centavos. Sum of DEBIT transactions in this category and all its subcategory descendants in the reference month.
        percentage:
          type: number
          format: double
          description: spentAmount / limitAmount × 100. Can exceed 100.
        status:
          type: string
          enum: [OK, WARNING, EXCEEDED]
          description: "OK: <80%. WARNING: 80-99%. EXCEEDED: >=100%."
        isRecurring:
          type: boolean
        alertAt80:
          type: boolean
        alertAt100:
          type: boolean
        daysRemainingInMonth:
          type: integer

    BudgetActualRow:
      type: object
      required: [categoryId, categoryName, spentAmount]
      properties:
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        spentAmount:
          type: integer
          format: int64
          description: Centavos
        limitAmount:
          type: integer
          format: int64
          nullable: true
          description: Centavos. Null if no budget exists for this category.
        variance:
          type: integer
          format: int64
          nullable: true
          description: Centavos. limitAmount - spentAmount. Null if no budget.
        hasBudget:
          type: boolean

    ErrorResponse:
      type: object
      required: [timestamp, status, error, message]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
