services:
  mongodb:
    image: mongo:latest
    container_name: mithril_mongodb
    # Single-node replica set so reactive multi-document transactions work locally
    # (see docs/architecture-contract.md P7). A replica set with access control
    # requires an internal-auth keyfile; we generate one on first boot in the
    # entrypoint wrapper below, then hand off to the official entrypoint.
    command:
      ["mongod", "--replSet", "rs0", "--keyFile", "/etc/mongo/keyfile", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:-root}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-mithril_vault}
    entrypoint:
      - bash
      - -c
      - |
        set -e
        if [ ! -s /etc/mongo/keyfile ]; then
          mkdir -p /etc/mongo
          openssl rand -base64 756 > /etc/mongo/keyfile
          chmod 400 /etc/mongo/keyfile
          chown 999:999 /etc/mongo/keyfile
        fi
        exec docker-entrypoint.sh "$$@"
      - --
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - mongodb_keyfile:/etc/mongo
    healthcheck:
      test:
        ["CMD", "mongosh", "-u", "${MONGODB_ROOT_USER:-root}", "-p", "${MONGODB_ROOT_PASSWORD:-root}",
         "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # One-shot: initiate the replica set once mongod is healthy, then exit.
  mongo-init:
    image: mongo:latest
    container_name: mithril_mongo_init
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongodb:27017 \
          -u "${MONGODB_ROOT_USER:-root}" -p "${MONGODB_ROOT_PASSWORD:-root}" \
          --quiet --eval '
            try { rs.status(); print("replica set already initialized"); }
            catch (e) {
              rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] });
              print("replica set initiated");
            }'

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  mongodb_keyfile:
    driver: local
