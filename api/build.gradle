import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
	id 'java'
	id 'jacoco'
	alias(libs.plugins.spring.boot)
	alias(libs.plugins.spotless)
}

group   = 'com.mithrilvault'
version = '0.0.1-SNAPSHOT'
description = 'Reactive API for Mithril Vault'

// ─────────────────────────────────────────────
// Java toolchain
// ─────────────────────────────────────────────

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// ─────────────────────────────────────────────
// Code style
// ─────────────────────────────────────────────

spotless {
	java {
		googleJavaFormat()
		removeUnusedImports()
		endWithNewline()
		trimTrailingWhitespace()
	}
}

// ─────────────────────────────────────────────
// Configurations
// ─────────────────────────────────────────────

configurations {
	mockitoAgent
}

// ─────────────────────────────────────────────
// Dependencies
// ─────────────────────────────────────────────

dependencies {

	def bom = platform(SpringBootPlugin.BOM_COORDINATES)
	implementation         bom
	annotationProcessor    bom
	testImplementation     bom
	developmentOnly        bom

	testImplementation platform(libs.testcontainers.bom)

	// ── Production ────────────────────────────
	implementation libs.spring.boot.webflux
	implementation libs.spring.boot.data.mongodb
	implementation libs.spring.boot.actuator
	implementation libs.spring.boot.security
	implementation libs.spring.boot.oauth2.resource
	implementation libs.spring.boot.validation
	implementation libs.springdoc.webflux
	implementation libs.mapstruct.core
	implementation libs.spring.security.oauth2.jose
	implementation libs.spring.boot.tracing.brave
	implementation libs.micrometer.tracing.bridge.brave
	implementation libs.micrometer.context.propagation
	implementation libs.logstash.logback.encoder
	implementation libs.spring.cloud.aws.secrets
	implementation libs.spring.cloud.aws.sqs

	implementation platform(libs.mongock.bom)
	implementation libs.mongock.springboot
	implementation libs.mongock.mongodb.reactive

	// ── Development ───────────────────────────
	developmentOnly libs.spring.boot.devtools

	// ── Annotation Processors ─────────────────
	compileOnly     libs.lombok
	annotationProcessor libs.lombok
	annotationProcessor libs.lombok.mapstruct.binding
	testCompileOnly     libs.lombok
	testAnnotationProcessor libs.lombok
	annotationProcessor libs.mapstruct.processor

	// ── Mockito agent (declared upfront to avoid JDK dynamic-agent warnings) ──
	mockitoAgent(platform(SpringBootPlugin.BOM_COORDINATES))
	mockitoAgent("org.mockito:mockito-core") { transitive = false }

	// ── Tests ─────────────────────────────────
	testImplementation libs.spring.boot.test
	testImplementation libs.spring.boot.testcontainers
	testImplementation libs.spring.security.test
	testImplementation libs.reactor.test
	testImplementation libs.testcontainers.junit
	testImplementation libs.testcontainers.mongodb
	testImplementation libs.testcontainers.localstack
	testImplementation libs.archunit.junit5
	testRuntimeOnly    libs.junit.platform.launcher
}

dependencyLocking {
	lockAllConfigurations()
}

// ─────────────────────────────────────────────
// Test configuration
// ─────────────────────────────────────────────

tasks.named('test') {
	useJUnitPlatform()
	jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
	description = 'Runs all tests (unit and integration).'
}

// ─────────────────────────────────────────────
// Coverage
// ─────────────────────────────────────────────

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

jacocoTestCoverageVerification {
	dependsOn jacocoTestReport
	violationRules {
		rule {
			limit {
				minimum = 0.80
			}
		}
	}
}

check.dependsOn jacocoTestCoverageVerification