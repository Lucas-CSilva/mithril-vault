spring:
  config:
    import:
      - "optional:aws-secretsmanager:/mithril-vault/mongodb"
      - "optional:aws-secretsmanager:/mithril-vault/jwt"

  webflux:
    base-path: /mithril-vault
    codecs:
      max-in-memory-size: 16MB

  mongodb:
      connection-pool:
        min-size: 10
        max-size: 100
        max-wait-time: 5000ms
        max-connection-life-time: 30m
        max-connection-idle-time: 10m

springdoc:
  show-actuator: true
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  health:
    mongo:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.mongodb.driver: INFO
    com.mithrilvault.api: INFO

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
  security:
    public-paths:
      - /actuator/health
      - /actuator/info
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /webjars/**
      - /register
      - /login
      - /refresh
      - /logout
  jwt:
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 2592000
