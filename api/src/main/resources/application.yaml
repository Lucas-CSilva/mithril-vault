spring:
  webflux:
    base-path: /api/mithril-vault

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://root:root@localhost:27017/mithril_vault?authSource=admin}
      connection-pool:
        min-size: 10
        max-size: 100
        max-wait-time: 5000ms
        max-connection-life-time: 30m
        max-connection-idle-time: 10m

springdoc:
  show-actuator: true

  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator

  endpoint:
    health:
      show-details: when-authorized

  health:
    mongodb:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.springframework.web: ${LOG_LEVEL:INFO}
    org.mongodb.driver: ${LOG_LEVEL:INFO}
    com.mithrilvault.api: ${LOG_LEVEL:INFO}

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
