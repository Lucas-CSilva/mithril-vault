spring:
  webflux:
    base-path: /api/mithril-vault
    codecs:
      max-in-memory-size: 16MB

  mongodb:
      uri: mongodb://root:root@localhost:27017/mithril_vault?authSource=admin&replicaSet=rs0
      connection-pool:
        min-size: 10
        max-size: 100
        max-wait-time: 5000ms
        max-connection-life-time: 30m
        max-connection-idle-time: 10m

springdoc:
  show-actuator: true
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  health:
    mongo:
      enabled: true

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.mongodb.driver: INFO
    com.mithrilvault.api: INFO

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
  security:
    public-paths:
      - /actuator/health
      - /actuator/info
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /webjars/**
