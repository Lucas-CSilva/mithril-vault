# Local development profile — set SPRING_PROFILES_ACTIVE=local in your IDE run configuration.
# Security is fully open (no auth server required).

app:
  jwt:
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 2592000

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.mongodb.driver: INFO
    com.mithrilvault.api: DEBUG

management:
  endpoint:
    health:
      show-details: always

spring:
  config:
    import:
      - "optional:aws-secretsmanager:/mithril-vault/mongodb"
      - "optional:aws-secretsmanager:/mithril-vault/jwt"

  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: test
        secret-key: test
      secretsmanager:
        endpoint: http://localhost:4566
      sqs:
        endpoint: http://localhost:4566
